// ===================== UTILIDADES =====================

function toast(msg, type = 'success') {
    const colors = { success: '#16a34a', error: '#dc2626', info: '#374151' };
    const el = document.createElement('div');
    el.className = 'toast';
    el.style.background = colors[type] || colors.info;
    el.textContent = msg;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => el.remove(), 3000);
}
function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function semaphoreColor(val) {
    if (val === true) return 'green';
    if (val === 'pendiente' || val === false) return 'gray';
    return 'gray';
}

// ===================== RENDER: NAVEGACIÓN =====================

function renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = VIEWS.map(v => `
        <button onclick="navigate('${v.id}')" class="nav-item w-full text-left px-3 py-2 rounded text-sm text-gray-600 flex items-center gap-2 ${state.currentView === v.id ? 'active' : ''}">
            <span class="text-xs opacity-60">${v.icon}</span> ${v.label}
        </button>
    `).join('');
}

function renderStageSelect() {
    const sel = document.getElementById('stageSelect');
    sel.innerHTML = STAGES.map((s, i) => `<option value="${i}" ${i === state.currentStage ? 'selected' : ''}>Etapa ${s.id}: ${s.short}</option>`).join('');
    sel.onchange = (e) => { state.currentStage = parseInt(e.target.value); render(); toast(`Etapa actual: ${STAGES[state.currentStage].short}`); };
}

function renderPipeline() {
    const container = document.getElementById('stagePipeline');
    let html = '';
    STAGES.forEach((s, i) => {
        const isDone = i < state.currentStage;
        const isCurrent = i === state.currentStage;
        const isPending = i > state.currentStage;
        const cls = isDone ? 'done' : isCurrent ? 'current' : 'pending';
        if (i > 0) {
            html += `<div class="stage-connector ${i <= state.currentStage ? 'done' : 'pending'}"></div>`;
        }
        html += `
            <div class="flex flex-col items-center gap-1 min-w-0" title="${s.desc}">
                <div class="stage-node ${cls}" onclick="document.getElementById('stageSelect').value=${i};state.currentStage=${i};render();toast('Etapa actual: ${s.short}');">
                    ${isDone ? '✓' : s.id}
                </div>
                <div class="text-xs font-medium truncate max-w-[120px] ${isCurrent ? 'text-yellow-700' : isDone ? 'text-green-700' : 'text-gray-400'}">${s.short}</div>
            </div>
        `;
    });
    container.innerHTML = html;
}

// ===================== RENDER: VISTAS =====================

function renderContent() {

        case 'postulantes': c.innerHTML = renderPostulantes(); break;

function handleRankingUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
            toast(`Excel cargado: ${workbook.SheetNames.length} hoja(s), ${json.length - 1} filas en "${workbook.SheetNames[0]}"`, 'success');
            // En producción: parsear y reemplazar POSTULANTES
        } catch(err) {
            toast('Error al leer el archivo', 'error');
        }
    };
    reader.readAsArrayBuffer(file);
}

function applyTemplate(id) {
    const t = EMAIL_TEMPLATES.find(t => t.id == id);
    if (t) {
        state.composeData.asunto = t.asunto;
        state.composeData.cuerpo = t.cuerpo;
        renderContent();
    }
}

function useTemplate(id) {
    const t = EMAIL_TEMPLATES.find(t => t.id === id);
    state.composeData = { destinatario: '', asunto: t.asunto, cuerpo: t.cuerpo };
    state.showCompose = true;
    renderContent();
}

function sendEmail() {
    if (!state.composeData.destinatario || !state.composeData.asunto) {
        toast('Completá destinatario y asunto', 'error');
        return;
    }
    const now = new Date();
    const fecha = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    SENT_EMAILS.unshift({
        id: SENT_EMAILS.length + 1,
        destinatario: state.composeData.destinatario,
        asunto: state.composeData.asunto,
        fecha: fecha,
        template: null
    });
    state.showCompose = false;
    state.composeData = { destinatario: '', asunto: '', cuerpo: '' };
    toast('Correo enviado');
    renderContent();
}
